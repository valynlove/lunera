name: lunera
description: Personal health & therapy tracking application
publish_to: none
version: 1.5.0+7
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  file_selector: ^1.0.3
  share_plus: ^10.1.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  local_auth: ^2.2.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  image_picker: ^1.2.4
  home_widget: ^0.10.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
