name: Automatic Release & Landing Page Deployment

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Flutter Web App
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Read Changelog
        id: read_changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            CONTENT=$(cat CHANGELOG.md)
          else
            CONTENT="Release built automatically from commit ${{ github.sha }}"
          fi
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or Update Official GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          body: ${{ steps.read_changelog.outputs.BODY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0.0"
          name: "Lunera v1.0.0 - Personal Health & HRT Tracker"
          allowUpdates: true
          makeLatest: true

      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
