name: Automatic Release Notes & Landing Page Deployment

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Changelog
        id: read_changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            CONTENT=$(cat CHANGELOG.md)
          else
            CONTENT="Release built automatically from commit ${{ github.sha }}"
          fi
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or Update Official GitHub Release
        uses: ncipollo/release-action@v1
        with:
          body: ${{ steps.read_changelog.outputs.BODY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0.0"
          name: "Lunera v1.0.0 - Personal Health & HRT Tracker"
          allowUpdates: true
          makeLatest: true

  deploy-landing-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Landing Page to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
